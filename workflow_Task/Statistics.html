<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport"
              content="width=device-width, initial-scale=1.0">
        <meta name="description"
              content="anything for now ">
        <title>taskFlow</title>
        <link rel="shortcut icon"
              href="img/book-open-reader.svg"
              type="image/x-icon">
        <link rel="stylesheet"
              href="css/normalize.css">
        <link rel="stylesheet"
              href="css/all.min.css">
        <link rel="stylesheet"
              href="css/style.css">
    </head>

    <body>
        <main class="main-page">
            <aside>
                <div class="logo">
                    <h1>Task Flow</h1>
                </div>
                <ul>
                    <li>
                        <a href="index.html">
                            <i class="fa fa-house"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="allTask.html">
                            <i class="fa fa-list-check"></i>
                            <span>All tasks</span>
                        </a>
                    </li>
                    <li >
                        <a href="todayTasks.html">
                            <i class="fa fa-calendar-day"></i>
                            <span>Today / Due Today</span>
                        </a>
                    </li>
                    <li>
                        <a href="priority.html">
                            <i class="fa fa-star"></i>
                            <span>Priority</span>
                        </a>
                    </li>
                    <li>
                        <a href="settings.html">
                            <i class="fa fa-gear"></i>
                            <span>Settings</span>
                        </a>
                    </li>

                    <li class="active">
                        <a href="Statistics.html">
                            <i class="fa fa-chart-column"></i>
                            <span>Statistics</span>
                        </a>
                    </li>
                </ul>
            </aside>
            <section class="wrapper">
                <header>
                    <nav>
                        <div class="search">
                            <i class="fa fa-search"></i>
                            <input type="text"
                                   name="search"
                                   placeholder="Search...">
                            </div>

                            <div class="profile">
                                <img src="img/profile.jpg"
                                     alt="Profile Image">
                                <i class="fa fa-bell"></i>
                            </div>

                    </nav>
                </header>
                <div class="head">
                    <h1>Statistics</h1>
                
                </div>
                <div class="container stat-container">
                    <div class="stat-card">
                        <div class="today styled">
                            <i class="fa fa-list-check"></i>
                            <span class="number"></span>
                            <p>Total Tasks </p>
                        </div>
                        
                        <div class="complete styled">
                            <i class="fa fa-flag"></i>
                            <span class="number"></span>
                            <p>High Priority Tasks </p>
                        </div>
                        
                        <div class="pending styled">
                            <i class="fa fa-clock"></i>
                            <span class="number"></span>
                            <p>Pending Tasks </p>
                        </div>

                        <div class="week styled">
                            <i class="fa fa-bolt"></i>
                            <span class="number">30</span>
                            <p>This Week Tasks </p>
                        </div>
                    </div>
                </div>

            </section>
        </main>
        <script src="main.js"></script>
    </body>

</html>
