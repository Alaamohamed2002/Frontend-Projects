<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="anything for now ">
        <title>taskFlow</title>
        <link rel="shortcut icon" href="img/book-open-reader.svg" type="image/x-icon">
        <link rel="stylesheet" href="css/normalize.css">
        <link rel="stylesheet" href="css/all.min.css">
        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>
        <main class="main-page">
            <aside>
                <div class="logo">
                    <h1>Task Flow</h1>
                </div>
                <ul>
                    <li>
                        <a href="index.html">
                            <i class="fa fa-house"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li >
                        <a href="allTask.html">
                            <i class="fa fa-list-check"></i>
                            <span>All tasks</span>
                        </a>
                    </li>
                    <li>
                        <a href="todayTasks.html">
                            <i class="fa fa-calendar-day"></i>
                            <span>Today / Due Today</span>
                        </a>
                    </li>
                    <li class="active">
                        <a href="priority.html">
                            <i class="fa fa-star"></i>
                            <span>Priority</span>
                        </a>
                    </li>
                    <li>
                        <a href="settings.html">
                            <i class="fa fa-gear"></i>
                            <span>Settings</span>
                        </a>
                    </li>
            
                    <li>
                        <a href="Statistics.html">
                            <i class="fa fa-chart-column"></i>
                            <span>Statistics</span>
                        </a>
                    </li>
                </ul>
            </aside>
            <section class="wrapper ">
                <header>
                    <nav>
                        <div class="search">
                            <i class="fa fa-search"></i>
                            <input type="text"
                                   name="search"
                                   placeholder="Search...">
                        </div>
                
                        <div class="profile">
                            <img src="img/profile.jpg"
                                 alt="Profile Image">
                            <i class="fa fa-bell"></i>
                        </div>
                    </nav>
                </header>
                <div class="head">
                    <h1>Priority</h1>

                </div>

                <div class="fillter container">
                    <nav>
                        <ul>
                            <li data-priority =".all" class="active">All</li>
                            <li data-priority =".high">High</li>
                            <li data-priority =".medium">Medium</li>
                            <li data-priority =".low">Low</li>
                            <!-- <li data-priority =".overdue">Overdue</li> -->
                        </ul>
                    </nav>
                </div>

                <div class="priority-container container">


                    <div class=" all high high-priority">
                    <h2>High Priority - <span class="tasks-num"></span> Tasks</h2>
                            <div class="content-container">
                            
                            </div>
                            <button class="see-more"></button>
                    </div>
                    <div class=" all medium medium-priority">
                        <h2>Medium Priority - <span class="tasks-num"></span> Tasks</h2>
                            <div class="content-container">
                            
                            </div>
                            <button class="see-more"></button>
                    </div>
                    <div class="all low low-priority">
                        <h2>Low Priority - <span class="tasks-num"></span> Tasks</h2>
                        <div class="content-container">
                    
                        </div>
                        <button class="see-more"></button>
                    </div>

                </div>  
            </section>
        </main>
        <script src="main.js"></script>
    </body>

</html>
